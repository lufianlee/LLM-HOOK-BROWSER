<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Security Proxy - Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232734;
      --border: #2e3348;
      --text: #e2e4ed;
      --text-dim: #8b8fa3;
      --accent: #6c7bff;
      --critical: #ff4d6a;
      --high: #ff8c42;
      --medium: #ffd166;
      --low: #06d6a0;
      --info: #118ab2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .status { display: flex; align-items: center; gap: 8px; }
    .header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--low);
      animation: pulse 2s infinite;
    }
    .header .dot.disconnected { background: var(--critical); animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .layout { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; height: calc(100vh - 57px); }

    .stats-bar {
      grid-column: 1 / -1;
      display: flex;
      gap: 16px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .stat-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      min-width: 140px;
    }
    .stat-card .label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; margin-top: 2px; }

    .panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel:last-child { border-right: none; }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 8px; }

    .toolbar { display: flex; gap: 6px; }
    .toolbar button, .toolbar select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .toolbar button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .toolbar button.danger:hover { background: var(--critical); border-color: var(--critical); }

    .req-item, .finding-item, .sim-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .req-item:hover, .finding-item:hover, .sim-item:hover { border-color: var(--accent); }
    .req-item.selected, .finding-item.selected { border-color: var(--accent); background: rgba(108,123,255,0.08); }

    .method {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      margin-right: 6px;
    }
    .method.GET { background: rgba(6,214,160,0.15); color: var(--low); }
    .method.POST { background: rgba(108,123,255,0.15); color: var(--accent); }
    .method.PUT { background: rgba(255,209,102,0.15); color: var(--medium); }
    .method.DELETE { background: rgba(255,77,106,0.15); color: var(--critical); }
    .method.PATCH { background: rgba(255,140,66,0.15); color: var(--high); }

    .severity-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .severity-badge.critical { background: rgba(255,77,106,0.15); color: var(--critical); }
    .severity-badge.high { background: rgba(255,140,66,0.15); color: var(--high); }
    .severity-badge.medium { background: rgba(255,209,102,0.15); color: var(--medium); }
    .severity-badge.low { background: rgba(6,214,160,0.15); color: var(--low); }
    .severity-badge.info { background: rgba(17,138,178,0.15); color: var(--info); }

    .chain-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(108,123,255,0.2);
      color: var(--accent);
      margin-left: 4px;
    }

    .req-path { color: var(--text-dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .req-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 10px; color: var(--text-dim); }

    .detail-panel {
      grid-column: 1 / -1;
      background: var(--surface);
      border-top: 1px solid var(--border);
      max-height: 40vh;
      overflow-y: auto;
      padding: 16px 24px;
      display: none;
    }
    .detail-panel.open { display: block; }
    .detail-panel h3 { font-size: 13px; margin-bottom: 8px; }
    .detail-panel pre {
      background: var(--bg);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 11px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .detail-section { margin-bottom: 16px; }
    .detail-section h4 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }

    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
    }
    .btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-dim); }

    .domain-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      width: 200px;
    }

    .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--surface2); border: 1px solid var(--accent);
      padding: 10px 16px; border-radius: 6px;
      font-size: 12px; z-index: 1000;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="header">
  <h1>LLM Security Proxy</h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <div>
      <label style="font-size:11px;color:var(--text-dim);">Domains: </label>
      <input class="domain-input" id="domainInput" placeholder="example.com, api.example.com" />
      <button class="btn" onclick="updateDomains()">Apply</button>
    </div>
    <div class="status">
      <div class="dot" id="wsStatus"></div>
      <span id="wsLabel" style="font-size:11px;">Connecting...</span>
    </div>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat-card"><div class="label">Requests</div><div class="value" id="statReqs">0</div></div>
  <div class="stat-card"><div class="label">Findings</div><div class="value" id="statFindings">0</div></div>
  <div class="stat-card"><div class="label">Simulations</div><div class="value" id="statSims">0</div></div>
  <div class="stat-card"><div class="label">Critical</div><div class="value" style="color:var(--critical)" id="statCritical">0</div></div>
  <div class="stat-card"><div class="label">High</div><div class="value" style="color:var(--high)" id="statHigh">0</div></div>
  <div class="stat-card"><div class="label">Medium</div><div class="value" style="color:var(--medium)" id="statMedium">0</div></div>
</div>

<div class="layout" id="mainLayout">
  <div class="panel">
    <div class="panel-header">
      <span>Captured Requests</span>
      <div class="toolbar">
        <select id="methodFilter" onchange="loadRequests()">
          <option value="">All Methods</option>
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
          <option value="PATCH">PATCH</option>
        </select>
        <button onclick="loadRequests()">Refresh</button>
      </div>
    </div>
    <div class="panel-body" id="requestList">
      <div class="empty-state">Waiting for proxy traffic...</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Findings</span>
      <div class="toolbar">
        <select id="severityFilter" onchange="loadFindings()">
          <option value="">All Severities</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <label style="font-size:11px;display:flex;align-items:center;gap:4px;">
          <input type="checkbox" id="chainOnlyFilter" onchange="loadFindings()"> Chains only
        </label>
        <button onclick="runChainAnalysis()">Chain Analysis</button>
      </div>
    </div>
    <div class="panel-body" id="findingList">
      <div class="empty-state">No findings yet</div>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel"></div>
</div>

<script>
const API = '';
let ws = null;
let selectedReqId = null;
let selectedFindingId = null;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('wsStatus').className = 'dot';
    document.getElementById('wsLabel').textContent = 'Connected';
  };
  ws.onclose = () => {
    document.getElementById('wsStatus').className = 'dot disconnected';
    document.getElementById('wsLabel').textContent = 'Disconnected';
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'new_request') {
      loadRequests();
      loadStats();
    } else if (msg.type === 'new_findings' || msg.type === 'new_chain_findings') {
      loadFindings();
      loadStats();
      showToast(`${msg.data.length} new finding(s) detected`);
    } else if (msg.type === 'simulation_result') {
      showToast(`Simulation: ${msg.data.status} - ${msg.data.attack_type}`);
    }
  };
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return res.json();
}

async function loadStats() {
  const s = await api('/stats');
  document.getElementById('statReqs').textContent = s.total_requests;
  document.getElementById('statFindings').textContent = s.total_findings;
  document.getElementById('statSims').textContent = s.total_simulations;
  document.getElementById('statCritical').textContent = s.severity_counts.critical || 0;
  document.getElementById('statHigh').textContent = s.severity_counts.high || 0;
  document.getElementById('statMedium').textContent = s.severity_counts.medium || 0;
}

async function loadRequests() {
  const method = document.getElementById('methodFilter').value;
  const params = new URLSearchParams({ limit: '100' });
  if (method) params.set('method', method);
  const reqs = await api(`/requests?${params}`);
  const el = document.getElementById('requestList');
  if (!reqs.length) { el.innerHTML = '<div class="empty-state">No requests captured yet</div>'; return; }
  el.innerHTML = reqs.map(r => `
    <div class="req-item ${r.id === selectedReqId ? 'selected' : ''}" onclick="selectRequest(${r.id})">
      <div>
        <span class="method ${r.method}">${r.method}</span>
        <span style="font-size:11px;">${r.status_code || '...'}</span>
      </div>
      <div class="req-path">${r.host}${r.path}</div>
      <div class="req-meta">
        <span>${new Date(r.timestamp).toLocaleTimeString()}</span>
        <span>${r.content_type || '-'}</span>
      </div>
    </div>
  `).join('');
}

async function loadFindings() {
  const severity = document.getElementById('severityFilter').value;
  const chainOnly = document.getElementById('chainOnlyFilter').checked;
  const params = new URLSearchParams({ limit: '100' });
  if (severity) params.set('severity', severity);
  if (chainOnly) params.set('chain_only', 'true');
  const findings = await api(`/findings?${params}`);
  const el = document.getElementById('findingList');
  if (!findings.length) { el.innerHTML = '<div class="empty-state">No findings yet</div>'; return; }
  el.innerHTML = findings.map(f => `
    <div class="finding-item ${f.id === selectedFindingId ? 'selected' : ''}" onclick="selectFinding(${f.id})">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span class="severity-badge ${f.severity}">${f.severity}</span>
        ${f.is_chain ? '<span class="chain-badge">CHAIN</span>' : ''}
        <span style="font-size:11px;font-weight:600;">${f.title}</span>
      </div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${f.vuln_type} | Confidence: ${(f.confidence * 100).toFixed(0)}%</div>
    </div>
  `).join('');
}

async function selectRequest(id) {
  selectedReqId = id;
  loadRequests();
  const r = await api(`/requests/${id}`);
  const dp = document.getElementById('detailPanel');
  dp.className = 'detail-panel open';
  let headers, body, resHeaders, resBody;
  try { headers = JSON.stringify(JSON.parse(r.request_headers), null, 2); } catch { headers = r.request_headers; }
  try { resHeaders = JSON.stringify(JSON.parse(r.response_headers), null, 2); } catch { resHeaders = r.response_headers; }
  try { body = JSON.stringify(JSON.parse(r.request_body), null, 2); } catch { body = r.request_body; }
  try { resBody = JSON.stringify(JSON.parse(r.response_body), null, 2); } catch { resBody = r.response_body; }
  dp.innerHTML = `
    <h3>${r.method} ${r.url} <span style="color:var(--text-dim);font-size:11px;">Status: ${r.status_code}</span></h3>
    <div class="actions">
      <button class="btn primary" onclick="analyzeRequest(${r.id})">Analyze with LLM</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;">
      <div>
        <div class="detail-section"><h4>Request Headers</h4><pre>${esc(headers)}</pre></div>
        <div class="detail-section"><h4>Request Body</h4><pre>${esc(body || '(empty)')}</pre></div>
      </div>
      <div>
        <div class="detail-section"><h4>Response Headers</h4><pre>${esc(resHeaders)}</pre></div>
        <div class="detail-section"><h4>Response Body</h4><pre>${esc(resBody || '(empty)')}</pre></div>
      </div>
    </div>
  `;
}

async function selectFinding(id) {
  selectedFindingId = id;
  loadFindings();
  const f = await api(`/findings/${id}`);
  const dp = document.getElementById('detailPanel');
  dp.className = 'detail-panel open';
  dp.innerHTML = `
    <h3>
      <span class="severity-badge ${f.severity}">${f.severity}</span>
      ${f.is_chain ? '<span class="chain-badge">CHAIN</span>' : ''}
      ${esc(f.title)}
    </h3>
    <div class="actions">
      <button class="btn primary" onclick="simulateFinding(${f.id})">Run Attack Simulation</button>
      <button class="btn" onclick="selectRequest(${f.request_id})">View Request</button>
    </div>
    <div style="margin-top:12px;">
      <div class="detail-section"><h4>Type</h4><pre>${esc(f.vuln_type)} ${f.cwe_id ? '(' + f.cwe_id + ')' : ''}</pre></div>
      <div class="detail-section"><h4>Description</h4><pre>${esc(f.description)}</pre></div>
      <div class="detail-section"><h4>Evidence</h4><pre>${esc(f.evidence)}</pre></div>
      <div class="detail-section"><h4>Recommendation</h4><pre>${esc(f.recommendation)}</pre></div>
      <div class="detail-section"><h4>Confidence</h4><pre>${(f.confidence * 100).toFixed(1)}%</pre></div>
    </div>
  `;
}

async function analyzeRequest(id) {
  showToast('Analyzing request with LLM...');
  const findings = await api('/analyze/single', { method: 'POST', body: JSON.stringify({ request_id: id }) });
  if (findings.length) {
    showToast(`Found ${findings.length} vulnerability(ies)`);
  } else {
    showToast('No vulnerabilities detected');
  }
  loadFindings();
  loadStats();
}

async function simulateFinding(id) {
  showToast('Running attack simulation...');
  const sim = await api('/simulate', { method: 'POST', body: JSON.stringify({ finding_id: id }) });
  const dp = document.getElementById('detailPanel');
  dp.className = 'detail-panel open';
  let rawReq, rawRes;
  try { rawReq = sim.raw_request; } catch { rawReq = ''; }
  try { rawRes = sim.raw_response; } catch { rawRes = ''; }
  dp.innerHTML = `
    <h3>Simulation Result: ${sim.attack_type}
      <span class="severity-badge ${sim.verified ? 'critical' : 'low'}">${sim.verified ? 'VERIFIED' : 'NOT VERIFIED'}</span>
    </h3>
    <div style="margin-top:12px;">
      <div class="detail-section"><h4>Status</h4><pre>${sim.status}</pre></div>
      <div class="detail-section"><h4>Summary</h4><pre>${esc(sim.result_summary)}</pre></div>
      <div class="detail-section"><h4>Payload</h4><pre>${esc(sim.payload)}</pre></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="detail-section"><h4>Raw Request</h4><pre>${esc(rawReq)}</pre></div>
        <div class="detail-section"><h4>Raw Response</h4><pre>${esc(rawRes)}</pre></div>
      </div>
    </div>
  `;
  loadStats();
}

async function runChainAnalysis() {
  showToast('Running chain attack analysis on recent requests...');
  const findings = await api('/analyze/chain', { method: 'POST', body: JSON.stringify({ last_n: 30 }) });
  if (findings.length) {
    showToast(`Detected ${findings.length} potential attack chain(s)`);
  } else {
    showToast('No chain attacks detected');
  }
  loadFindings();
  loadStats();
}

async function updateDomains() {
  const input = document.getElementById('domainInput').value;
  const domains = input.split(',').map(d => d.trim()).filter(Boolean);
  await api('/config/domains', { method: 'PUT', body: JSON.stringify({ domains }) });
  showToast(`Monitoring domains: ${domains.join(', ') || 'ALL'}`);
}

async function loadDomains() {
  const cfg = await api('/config/domains');
  document.getElementById('domainInput').value = cfg.domains.join(', ');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

connectWS();
loadStats();
loadRequests();
loadFindings();
loadDomains();
setInterval(loadStats, 10000);
</script>
</body>
</html>
